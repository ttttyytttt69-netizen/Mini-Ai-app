<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Modern Snake Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f1117;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    text-align:center;
    width:100%;
    max-width:600px;
}

h1{
    margin-bottom:15px;
    font-size:2rem;
}

.score-board{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    gap:10px;
}

.score-card{
    flex:1;
    background:#1a1d29;
    border:1px solid #2a2f42;
    padding:14px;
    border-radius:14px;
}

.score-card h3{
    font-size:14px;
    color:#aaa;
}

.score-card p{
    font-size:22px;
    font-weight:bold;
    margin-top:6px;
}

.game-wrapper{
    position:relative;
    display:flex;
    justify-content:center;
}

canvas{
    background:#161922;
    border:3px solid #2a2f42;
    border-radius:16px;
    width:100%;
    max-width:500px;
    aspect-ratio:1;
}

.overlay{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:rgba(0,0,0,0.75);
    border-radius:16px;
}

.hidden{
    display:none;
}

.overlay h2{
    margin-bottom:15px;
    font-size:2rem;
}

button{
    background:#4f7cff;
    border:none;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
    background:#6690ff;
}

.controls{
    margin-top:15px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.info{
    margin-top:15px;
    color:#999;
    font-size:14px;
}
</style>
</head>
<body>

<div class="container">

    <h1>🐍 Snake Game</h1>

    <div class="score-board">
        <div class="score-card">
            <h3>Current Score</h3>
            <p id="score">0</p>
        </div>

        <div class="score-card">
            <h3>High Score</h3>
            <p id="highScore">0</p>
        </div>
    </div>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="500" height="500"></canvas>

        <!-- Start Screen -->
        <div class="overlay" id="startScreen">
            <h2>Snake Game</h2>
            <button id="startBtn">Start Game</button>
        </div>

        <!-- Game Over Screen -->
        <div class="overlay hidden" id="gameOverScreen">
            <h2>Game Over</h2>
            <button id="restartBtn">Restart</button>
        </div>
    </div>

    <div class="controls">
        <button id="pauseBtn">Pause</button>
    </div>

    <div class="info">
        Controls: Arrow Keys / WASD • Space = Pause
    </div>

</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const GRID_SIZE = 20;
const TILE_COUNT = canvas.width / GRID_SIZE;

const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("highScore");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const pauseBtn = document.getElementById("pauseBtn");

let snake;
let direction;
let nextDirection;
let food;
let score;
let highScore =
    localStorage.getItem("snakeHighScore") || 0;

let gameRunning = false;
let isPaused = false;
let lastTime = 0;
const speed = 110; // movement speed (ms)

highScoreEl.textContent = highScore;

/* =========================
   Initialize Game
========================= */
function initGame() {
    snake = [
        {x:10, y:10}
    ];

    direction = {x:1, y:0};
    nextDirection = {x:1, y:0};

    score = 0;
    scoreEl.textContent = score;

    spawnFood();

    gameRunning = true;
    isPaused = false;

    pauseBtn.textContent = "Pause";

    gameOverScreen.classList.add("hidden");
}

/* =========================
   Food Spawn
========================= */
function spawnFood() {

    do {
        food = {
            x: Math.floor(Math.random() * TILE_COUNT),
            y: Math.floor(Math.random() * TILE_COUNT)
        };
    } while (
        snake.some(segment =>
            segment.x === food.x &&
            segment.y === food.y
        )
    );
}

/* =========================
   Draw Game
========================= */
function draw() {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Grid
    ctx.strokeStyle = "#202532";
    ctx.lineWidth = 1;

    for(let i=0;i<TILE_COUNT;i++){
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
    }

    // Food
    ctx.fillStyle = "#ff4757";

    ctx.beginPath();
    ctx.roundRect(
        food.x * GRID_SIZE + 2,
        food.y * GRID_SIZE + 2,
        GRID_SIZE - 4,
        GRID_SIZE - 4,
        8
    );
    ctx.fill();

    // Snake
    snake.forEach((segment,index)=>{

        ctx.fillStyle =
            index === 0
            ? "#4f7cff"
            : "#65d98a";

        ctx.beginPath();
        ctx.roundRect(
            segment.x * GRID_SIZE + 1,
            segment.y * GRID_SIZE + 1,
            GRID_SIZE - 2,
            GRID_SIZE - 2,
            6
        );
        ctx.fill();
    });
}

/* =========================
   Move Snake
========================= */
function update() {

    direction = nextDirection;

    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };

    // Wall collision
    if(
        head.x < 0 ||
        head.x >= TILE_COUNT ||
        head.y < 0 ||
        head.y >= TILE_COUNT
    ){
        gameOver();
        return;
    }

    // Self collision
    if(
        snake.some(segment =>
            segment.x === head.x &&
            segment.y === head.y
        )
    ){
        gameOver();
        return;
    }

    snake.unshift(head);

    // Eat food
    if(
        head.x === food.x &&
        head.y === food.y
    ){
        score++;
        scoreEl.textContent = score;

        if(score > highScore){
            highScore = score;
            localStorage.setItem(
                "snakeHighScore",
                highScore
            );
            highScoreEl.textContent =
                highScore;
        }

        spawnFood();
    } else {
        snake.pop();
    }
}

/* =========================
   Game Loop
========================= */
function gameLoop(timestamp){

    if(!gameRunning) return;

    if(isPaused){
        requestAnimationFrame(gameLoop);
        return;
    }

    if(timestamp - lastTime > speed){

        update();
        draw();

        lastTime = timestamp;
    }

    requestAnimationFrame(gameLoop);
}

/* =========================
   Game Over
========================= */
function gameOver(){
    gameRunning = false;
    gameOverScreen.classList.remove("hidden");
}

/* =========================
   Controls
========================= */
document.addEventListener("keydown",(e)=>{

    const key = e.key.toLowerCase();

    // Pause
    if(key === " "){
        e.preventDefault();

        if(gameRunning){
            togglePause();
        }
    }

    // Prevent reverse
    if(
        (key === "arrowup" || key === "w")
        && direction.y !== 1
    ){
        nextDirection = {x:0,y:-1};
    }

    if(
        (key === "arrowdown" || key === "s")
        && direction.y !== -1
    ){
        nextDirection = {x:0,y:1};
    }

    if(
        (key === "arrowleft" || key === "a")
        && direction.x !== 1
    ){
        nextDirection = {x:-1,y:0};
    }

    if(
        (key === "arrowright" || key === "d")
        && direction.x !== -1
    ){
        nextDirection = {x:1,y:0};
    }
});

/* =========================
   Pause
========================= */
function togglePause(){

    isPaused = !isPaused;

    pauseBtn.textContent =
        isPaused
        ? "Resume"
        : "Pause";
}

pauseBtn.addEventListener(
    "click",
    ()=>{
        if(gameRunning){
            togglePause();
        }
    }
);

/* =========================
   Start Game
========================= */
startBtn.addEventListener(
    "click",
    ()=>{
        startScreen.classList.add("hidden");

        initGame();
        draw();

        requestAnimationFrame(gameLoop);
    }
);

/* =========================
   Restart Game
========================= */
restartBtn.addEventListener(
    "click",
    ()=>{
        initGame();
        draw();

        requestAnimationFrame(gameLoop);
    }
);
</script>

</body>
</html>
